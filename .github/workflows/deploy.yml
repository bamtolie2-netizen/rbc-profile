# main 브랜치에 push하면 ① Supabase 함수 배포 ② web/ 을 GitHub Pages로 배포
# 필요한 설정 (GitHub 저장소 > Settings > Secrets and variables > Actions)
#   Variables: SUPABASE_PROJECT_ID   (예: abcdefghijklmnopqrst)
#   Secrets:   SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access Tokens)
# Pages: Settings > Pages > Source = "GitHub Actions"
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge function
        run: supabase functions deploy rbc-profile --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  pages:
    runs-on: ubuntu-latest
    needs: function
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the page at the function
        run: |
          sed -i 's#const API_URL = "";#const API_URL = "https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/rbc-profile";#' web/index.html
          grep -n "const API_URL" web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
